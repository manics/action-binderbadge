name: 'binder-badge'
on:
  pull_request:
  # pull_request_target:

jobs:
  badge:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
